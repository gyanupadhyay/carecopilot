[pytest]
testpaths = tests
# `..` puts the repo root on the path so the evaluation package (which lives
# beside backend/, not inside it) is importable by its own tests.
pythonpath = . ..
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    integration: requires a live PostgreSQL database (skipped without one)
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:passlib.*
    # neo4j 5.28's @_preview decorator calls asyncio.iscoroutinefunction,
    # which Python 3.14 deprecated. It fires at *import* of the driver, so
    # escalating it does not fail a test — it fails collection of every
    # module that reaches app.knowledge_graph, which is most of them.
    # Matched on the message so this stays an exemption for one third-party
    # call and not a blanket amnesty on neo4j deprecations.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning

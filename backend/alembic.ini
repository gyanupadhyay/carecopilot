# Alembic configuration.
#
# The database URL is intentionally absent: env.py reads it from
# app.config.settings so that migrations and the application can never
# disagree about which database they are pointed at, and so no credential
# is ever written into a tracked file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped, sortable revision filenames.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
